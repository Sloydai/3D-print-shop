<!doctype html><html><head><meta charset="utf-8">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>body{margin:0;background:#12234a;font-family:sans-serif}model-viewer{width:900px;height:900px;background:radial-gradient(#1d3566,#0b1833)}</style></head>
<body><model-viewer id="mv" camera-orbit="-30deg 75deg 105%" exposure="0.95" shadow-intensity="1" shadow-softness="0.8" environment-image="neutral" interaction-prompt="none"></model-viewer>
<script>const p=new URLSearchParams(location.search);const mv=document.getElementById('mv');mv.src=p.get('m');if(p.get('o'))mv.cameraOrbit=p.get('o');mv.addEventListener('load',()=>{document.title='loaded'});</script></body></html>
